name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  github-release:
    name: Create the GitHub Release from the CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # A pushed tag IS the release: this job makes the GitHub Releases page
      # incapable of drifting from the tags (it sat at v4.5.2 while npm
      # served 4.7.0, because creating the Release object was a separate
      # manual step). It fails when the tag does not match package.json or
      # the CHANGELOG has no section for the version - the release runbook
      # requires both, and a red run on the tag is the tripwire that they
      # were skipped.
      - name: Verify tag matches package.json and CHANGELOG, create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PKG_VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "package.json has version $PKG_VERSION but the tag says $VERSION" >&2
            exit 1
          fi
          awk -v ver="$VERSION" '$0 == "## " ver {f=1; next} /^## /{f=0} f' CHANGELOG.md > /tmp/notes.md
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "CHANGELOG.md has no section '## $VERSION' - add it and re-tag." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$TAG" --notes-file /tmp/notes.md

  publish-npm:
    name: Publish to npm
    # DISABLED until the npm trusted publisher is configured for
    # @didit-protocol/sdk-react-native (npmjs.com -> package -> Settings ->
    # Trusted Publisher: GitHub Actions, repository
    # didit-protocol/sdk-react-native, workflow release.yml), then set the
    # repository variable NPM_TRUSTED_PUBLISHING=true (Settings -> Secrets
    # and variables -> Actions -> Variables). No token secrets involved -
    # this replaces the interactive `npm publish` web-auth flow entirely,
    # and publishes with provenance.
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Trusted publishing needs a recent npm CLI (OIDC support).
      - name: Update npm
        run: npm install -g npm@latest

      # Idempotent: a re-run after a partial failure skips an already
      # published version. `npm publish` runs the prepare script (bob build)
      # on the packed tree.
      - name: Publish
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLISHED=$(npm view @didit-protocol/sdk-react-native version 2>/dev/null || echo none)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "@didit-protocol/sdk-react-native $VERSION is already on npm - skipping."
            exit 0
          fi
          npm publish
