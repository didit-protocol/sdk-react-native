name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  github-release:
    name: Create the GitHub Release from the CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # A pushed tag IS the release: this job makes the GitHub Releases page
      # incapable of drifting from the tags (it sat at v4.5.2 while npm
      # served 4.7.0, because creating the Release object was a separate
      # manual step). It fails when the tag does not match package.json or
      # the CHANGELOG has no section for the version - the release runbook
      # requires both, and a red run on the tag is the tripwire that they
      # were skipped.
      - name: Verify tag matches package.json and CHANGELOG, create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # The shallow tag-triggered checkout only guarantees the triggering
          # tag; fetch the full tag namespace explicitly so the Latest
          # comparison below sees every tag (checkout's fetch-tags does not
          # guarantee this at fetch-depth 1).
          git fetch --quiet origin '+refs/tags/*:refs/tags/*'
          PKG_VERSION=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "package.json has version $PKG_VERSION but the tag says $VERSION" >&2
            exit 1
          fi
          awk -v ver="$VERSION" '$0 == "## " ver {f=1; next} /^## /{f=0} f' CHANGELOG.md > /tmp/notes.md
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "CHANGELOG.md has no section '## $VERSION' - add it and re-tag." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do."
            exit 0
          fi
          # Prerelease versions (any -suffix) are published as prereleases and
          # never take the Latest badge. Stable versions take Latest only when
          # they are the highest STABLE v* tag - a rerun of an older tag's
          # workflow must never steal the badge, and omitting the flag is not
          # enough (the API defaults make_latest to true). The stable-only
          # filter is what makes sort -V exact: SemVer prerelease precedence
          # is the one thing version-sort gets wrong.
          # Classify prerelease on the part BEFORE any +build metadata:
          # hyphens are legal inside build metadata (4.8.0+ios-fix is stable).
          case "${VERSION%%+*}" in
            *-*)
              FLAGS="--prerelease --latest=false"
              ;;
            *)
              # Stable = x.y.z with optional +build metadata (legal in Dart
              # versions); build metadata is ignored for precedence per
              # SemVer, so the comparison runs on the numeric core.
              CORE="${VERSION%%+*}"
              HIGHEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$' | sed 's/^v//; s/+.*//' | sort -uV | tail -1)
              LATEST=false
              if [ "$CORE" = "$HIGHEST" ]; then LATEST=true; fi
              FLAGS="--latest=$LATEST"
              ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag $FLAGS \
            --title "$TAG" --notes-file /tmp/notes.md

  publish-npm:
    name: Publish to npm
    # DISABLED until the npm trusted publisher is configured for
    # @didit-protocol/sdk-react-native (npmjs.com -> package -> Settings ->
    # Trusted Publisher: GitHub Actions, repository
    # didit-protocol/sdk-react-native, workflow release.yml), then set the
    # repository variable NPM_TRUSTED_PUBLISHING=true (Settings -> Secrets
    # and variables -> Actions -> Variables). No token secrets involved -
    # this replaces the interactive `npm publish` web-auth flow entirely,
    # and publishes with provenance.
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A job-level permissions block REPLACES the workflow-level one, so
    # contents: read must be restated or checkout loses repository access.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      # Trusted publishing needs npm >= 11.5.1 (OIDC support). Pinned to the
      # npm 11 line: `npm@latest` is npm 12+, which requires a newer node
      # than the repo's pinned toolchain and fails with EBADENGINE.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      # Idempotent: a re-run after a partial failure skips an already
      # published version. `npm publish` runs the prepare script (bob build)
      # on the packed tree.
      - name: Publish
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Query the exact version, not `latest` - a rerun of an OLDER tag's
          # workflow must also detect its version as published.
          if [ -n "$(npm view "@didit-protocol/sdk-react-native@$VERSION" version 2>/dev/null)" ]; then
            echo "@didit-protocol/sdk-react-native $VERSION is already on npm - skipping."
            exit 0
          fi
          # Pick the dist-tag explicitly: npm requires --tag for prereleases,
          # and publishing an older stable version without one would repoint
          # `latest` at it. Only the highest stable v* tag publishes as
          # latest; the tag namespace is fetched so the comparison sees it.
          git fetch --quiet origin '+refs/tags/*:refs/tags/*'
          case "${VERSION%%+*}" in
            *-*)
              TAG_FLAG="--tag next"
              ;;
            *)
              CORE="${VERSION%%+*}"
              HIGHEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$' | sed 's/^v//; s/+.*//' | sort -uV | tail -1)
              if [ "$CORE" = "$HIGHEST" ]; then TAG_FLAG=""; else TAG_FLAG="--tag previous"; fi
              ;;
          esac
          npm publish $TAG_FLAG
